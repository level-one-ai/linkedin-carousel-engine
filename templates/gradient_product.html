<meta charset="utf-8" />
<style>
  @page { size: 1080px 1350px; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    background: #12082b;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    color: #ffffff;
    padding: 100px 88px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(155deg, #2a0f5c 0%, #12082b 55%, #0b1220 100%);
  }

  .slide:last-child { page-break-after: auto; break-after: auto; }

  /* Soft light bloom in the corner, kept inside the frame by overflow hidden. */
  .slide::after {
    content: "";
    position: absolute;
    right: -220px;
    top: -180px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(126, 87, 255, 0.55) 0%, rgba(126, 87, 255, 0) 68%);
  }

  .slide > * { position: relative; z-index: 1; }

  .kicker {
    font-size: 25px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-weight: 700;
    color: #c3a8ff;
    margin-bottom: 34px;
  }

  .heading {
    font-size: 88px;
    line-height: 1.06;
    font-weight: 800;
    letter-spacing: -0.025em;
    margin-bottom: 38px;
    background: linear-gradient(90deg, #ffffff 0%, #d5c4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .cover .heading { font-size: 112px; }

  .body {
    font-size: 38px;
    line-height: 1.5;
    color: #cdc3e8;
    max-width: 860px;
  }

  .bullets {
    list-style: none;
    margin-top: 54px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .bullets li {
    font-size: 33px;
    line-height: 1.4;
    background: rgba(255, 255, 255, 0.07);
    border: 2px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 26px 32px;
    color: #efeaff;
  }

  .spacer { flex: 1; }

  .subtitle {
    font-size: 40px;
    line-height: 1.4;
    color: #cdc3e8;
    margin-top: 12px;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid rgba(255, 255, 255, 0.16);
    padding-top: 32px;
    font-size: 26px;
    color: #a396c9;
    letter-spacing: 0.05em;
  }

  .dots { display: flex; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); }
  .dot.on { background: #c3a8ff; }
</style>

{{#each slides}}
<section class="slide {{#if isFirst}}cover{{/if}}">
  {{#if kicker}}<div class="kicker">{{kicker}}</div>{{/if}}
  <h1 class="heading">{{heading}}</h1>
  {{#if isFirst}}<p class="subtitle">{{../subtitle}}</p>{{/if}}
  {{#if body}}<p class="body">{{body}}</p>{{/if}}
  {{#if bullets.length}}
  <ul class="bullets">
    {{#each bullets}}<li>{{this}}</li>{{/each}}
  </ul>
  {{/if}}
  <div class="spacer"></div>
  <div class="footer">
    <span>{{../title}}</span>
    <span>{{number}} / {{../totalLabel}}</span>
  </div>
</section>
{{/each}}
