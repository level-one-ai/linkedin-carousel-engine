<meta charset="utf-8" />
<style>
  /* Exact LinkedIn 4:5 page geometry. Chromium renders CSS pixels at 96 DPI. */
  @page { size: 1080px 1350px; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    background: #0b1220;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    background: #0b1220;
    color: #e9eefb;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
  }

  .slide:last-child { page-break-after: auto; break-after: auto; }

  /* Thin accent rail down the left edge of every slide. */
  .slide::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 14px;
    height: 100%;
    background: linear-gradient(180deg, #2f6df6 0%, #7aa2ff 100%);
  }

  .kicker {
    font-size: 26px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #7aa2ff;
    font-weight: 700;
    margin-bottom: 36px;
  }

  .heading {
    font-size: 86px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 40px;
  }

  .cover .heading { font-size: 108px; }

  .body {
    font-size: 38px;
    line-height: 1.5;
    color: #a9b6d6;
    max-width: 860px;
  }

  .bullets {
    list-style: none;
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .bullets li {
    position: relative;
    padding-left: 46px;
    font-size: 34px;
    line-height: 1.4;
    color: #dfe6f7;
  }

  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 16px;
    width: 20px;
    height: 4px;
    background: #2f6df6;
  }

  .spacer { flex: 1; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid #1e2b45;
    padding-top: 32px;
    font-size: 26px;
    color: #6b7ba0;
    letter-spacing: 0.04em;
  }

  .subtitle {
    font-size: 40px;
    color: #a9b6d6;
    line-height: 1.45;
    margin-top: 8px;
  }

  .badge {
    display: inline-block;
    border: 2px solid #2f6df6;
    color: #7aa2ff;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 24px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
  }
</style>

{{#each slides}}
<section class="slide {{#if isFirst}}cover{{/if}}">
  {{#if kicker}}<div class="kicker">{{kicker}}</div>{{/if}}
  <h1 class="heading">{{heading}}</h1>
  {{#if isFirst}}<p class="subtitle">{{../subtitle}}</p>{{/if}}
  {{#if body}}<p class="body">{{body}}</p>{{/if}}
  {{#if bullets.length}}
  <ul class="bullets">
    {{#each bullets}}<li>{{this}}</li>{{/each}}
  </ul>
  {{/if}}
  <div class="spacer"></div>
  <div class="footer">
    <span>{{../title}}</span>
    <span>{{number}} / {{../totalLabel}}</span>
  </div>
</section>
{{/each}}
