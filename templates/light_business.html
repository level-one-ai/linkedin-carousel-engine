<meta charset="utf-8" />
<style>
  @page { size: 1080px 1350px; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    background: #ffffff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
  }

  .slide {
    position: relative;
    width: 1080px;
    height: 1350px;
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    background: #f7f5f0;
    color: #14161a;
    padding: 104px 92px;
    display: flex;
    flex-direction: column;
  }

  .slide:last-child { page-break-after: auto; break-after: auto; }

  /* Cover slide inverts the palette so the first frame stops the scroll. */
  .slide.cover { background: #14161a; color: #f7f5f0; }
  .slide.cover .body { color: #c8c4bb; }
  .slide.cover .rule { background: #c9a227; }

  .kicker {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 24px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8a7530;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .slide.cover .kicker { color: #c9a227; }

  .rule {
    width: 120px;
    height: 6px;
    background: #14161a;
    margin-bottom: 44px;
  }

  .heading {
    font-size: 82px;
    line-height: 1.12;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin-bottom: 36px;
  }

  .cover .heading { font-size: 100px; }

  .body {
    font-size: 37px;
    line-height: 1.55;
    color: #43474e;
    max-width: 840px;
  }

  .bullets {
    list-style: none;
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .bullets li {
    position: relative;
    padding-left: 52px;
    font-size: 33px;
    line-height: 1.45;
  }

  .bullets li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 26px;
    height: 26px;
    border: 4px solid #c9a227;
    border-radius: 50%;
  }

  .subtitle {
    font-size: 38px;
    line-height: 1.45;
    color: #43474e;
    margin-bottom: 26px;
  }

  .slide.cover .subtitle { color: #c8c4bb; }

  .spacer { flex: 1; }

  .footer {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid rgba(20, 22, 26, 0.16);
    padding-top: 30px;
    font-size: 25px;
    letter-spacing: 0.06em;
    color: #6d6f75;
  }

  .slide.cover .footer {
    border-top-color: rgba(247, 245, 240, 0.24);
    color: #a8a49b;
  }
</style>

{{#each slides}}
<section class="slide {{#if isFirst}}cover{{/if}}">
  {{#if kicker}}<div class="kicker">{{kicker}}</div>{{/if}}
  <div class="rule"></div>
  <h1 class="heading">{{heading}}</h1>
  {{#if isFirst}}<p class="subtitle">{{../subtitle}}</p>{{/if}}
  {{#if body}}<p class="body">{{body}}</p>{{/if}}
  {{#if bullets.length}}
  <ul class="bullets">
    {{#each bullets}}<li>{{this}}</li>{{/each}}
  </ul>
  {{/if}}
  <div class="spacer"></div>
  <div class="footer">
    <span>{{../title}}</span>
    <span>{{number}} / {{../totalLabel}}</span>
  </div>
</section>
{{/each}}
