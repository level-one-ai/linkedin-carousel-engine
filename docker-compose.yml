# Local development stack.
#
# On Coolify this file is not used: the app is one Application built from the
# Dockerfile, pointed at a PocketBase you already run. See COOLIFY.md.
#
# There is no Gotenberg service. The app renders slides by driving the Chromium
# that the Dockerfile installs, in process.
services:
  pocketbase:
    image: ghcr.io/pocketbase/pocketbase:latest
    container_name: carousel-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    command:
      - --dir=/pb_data
      - --http=0.0.0.0:8090
    volumes:
      # Without a volume here every post you have ever made is wiped on the
      # next rebuild.
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carousel-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # The service name resolves on the compose network, so no host port is used.
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    depends_on:
      - pocketbase
